# Configuração das Edge Functions (Supabase CLI)
# O webhook NÃO pode exigir JWT: o Mercado Pago não envia cabeçalho Authorization,
# então com verify_jwt ligado o gateway responderia 401 e o Pix nunca confirmaria.
project_id = "white-label-store"

[functions.create-mp-order]
# chamada pelo navegador (usa a anon key / sessão do cliente): mantém a exigência de JWT
verify_jwt = true

[functions.webhook-mercadopago]
# chamado pelo Mercado Pago, que NÃO envia Authorization.
# A autenticidade é garantida pela assinatura x-signature (MP_WEBHOOK_SECRET).
verify_jwt = false

[functions.whatsapp-notify]
# chamada por Database Webhooks e por outras functions, que NÃO carregam JWT.
# A autenticidade é garantida pelo header x-notify-secret (NOTIFY_SECRET).
verify_jwt = false

[functions.whatsapp-chat]
# chamada pelo painel admin (navegador): JWT do atendente é obrigatório,
# e a função ainda confere a role admin no banco antes de qualquer ação.
verify_jwt = true

[functions.whatsapp-webhook]
# chamada pela Evolution API, que NÃO envia Authorization.
# A autenticidade é garantida pelo segredo na URL (?secret=NOTIFY_SECRET).
verify_jwt = false
