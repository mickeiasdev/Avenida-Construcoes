<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#475569" />
    <script>
      // Pinta a loja com a cor que o lojista configurou ANTES do primeiro paint.
      // Sem isto o tema padrão do template (roxo) pisca até o StoreContext buscar
      // store_settings no Supabase e aplicar a cor real.
      (function () {
        try {
          var raw = localStorage.getItem('wls.brand.v1')
          if (!raw) return
          var c = JSON.parse(raw)
          if (!c || !c.primary) return
          var s = document.documentElement.style
          s.setProperty('--brand-primary', c.primary)
          if (c.secondary) s.setProperty('--brand-secondary', c.secondary)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', c.primary)
          var fs = Number(c.fontScale)
          if (fs >= 80 && fs <= 130) {
            document.documentElement.style.fontSize = (16 * fs / 100) + 'px'
          }
        } catch (e) {
          /* localStorage indisponível: segue com o padrão do CSS */
        }
      })()
    </script>
    <meta name="description" content="Depósito Avenida Construção — tudo para sua obra, do alicerce ao acabamento" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Avenida Construção" />
    <meta property="og:title" content="Depósito Avenida Construção" />
    <meta property="og:description" content="Tudo para sua obra — peça pelo WhatsApp e receba em casa." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Depósito Avenida Construção</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
